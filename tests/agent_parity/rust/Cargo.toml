[package]
name = "agent-parity"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[features]
native = []
rig = ["dep:rig-agent", "dep:rig-core", "dep:rig-reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = "0.37"
libc = "0.2"
rig-agent = { version = "=0.46.0", default-features = false, optional = true }
rig-core = { version = "=0.46.0", default-features = false, features = ["reqwest", "rustls"], optional = true }
rig-reqwest = { version = "=0.46.0", default-features = false, features = ["rustls"], optional = true }

[profile.release]
strip = true
